name: AI Test Review

on:
  pull_request:
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # changed from read: lets the action push the tests
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: SenuriDis/R26-SE-038@v1
        with:
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          max-functions: "2"
          commit-tests: "true"               # added: commit the tests back to the PR branch
          tests-dir: "tests/ai_generated"    # optional; this is already the default
