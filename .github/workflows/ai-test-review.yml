name: AI Test Review

on:
  pull_request:
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: SenuriDis/R26-SE-038@v1
        with:
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          max-functions: "3"
